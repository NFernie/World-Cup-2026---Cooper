name: Deploy Database Migrations

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Only SUPABASE_ACCESS_TOKEN should use the SUPABASE_ prefix here.
      # Other secrets passed as DB_PASSWORD avoid viper config parse conflicts.
      - name: Link Supabase project
        run: supabase link --project-ref fyiegingyipqtxaiopng -p "$DB_PASSWORD" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push Database Migrations
        run: supabase db push --linked --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push Supabase config (auth)
        run: supabase config push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Belt-and-braces: auto-confirm users without sending signup email (avoids built-in SMTP cap).
      - name: Disable confirmation emails (Management API)
        run: |
          curl -sf -X PATCH "https://api.supabase.com/v1/projects/fyiegingyipqtxaiopng/config/auth"             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             -H "Content-Type: application/json"             -d '{"mailer_autoconfirm":true,"mailer_secure_email_change_enabled":false}'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

