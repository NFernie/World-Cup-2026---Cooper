name: Deploy Database Migrations

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Only SUPABASE_ACCESS_TOKEN should use the SUPABASE_ prefix here.
      # Other secrets passed as DB_PASSWORD avoid viper config parse conflicts.
      - name: Link Supabase project
        run: supabase link --project-ref fyiegingyipqtxaiopng -p "$DB_PASSWORD" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push Database Migrations
        run: supabase db push --linked --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Applies auth.email settings from supabase/config.toml (enable_confirmations = false).
      - name: Push Supabase config (auth)
        run: supabase config push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions (API sync)
        run: |
          supabase functions deploy sync-fixtures --no-verify-jwt
          supabase functions deploy sync-match-results --no-verify-jwt
          supabase functions deploy sync-match-odds --no-verify-jwt
          supabase functions deploy sync-tournament-awards --no-verify-jwt
          supabase functions deploy sync-squads --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

