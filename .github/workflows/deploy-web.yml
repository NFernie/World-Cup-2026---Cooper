# Build the React app and deploy to GitHub Pages on every push to main.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
#
# Enable GitHub Pages (Settings → Pages → Source: GitHub Actions).
# Auth: username/password (no magic-link callback required).

name: Deploy Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Verify Supabase build secrets
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            echo "::error::Missing secret VITE_SUPABASE_URL (Project URL from Supabase → Settings → API)"
            exit 1
          fi
          if [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::Missing secret VITE_SUPABASE_ANON_KEY (anon public key from Supabase → Settings → API)"
            exit 1
          fi
          case "${{ secrets.VITE_SUPABASE_URL }}" in
            https://*) ;;
            *) echo "::error::VITE_SUPABASE_URL must start with https://"; exit 1 ;;
          esac

      - name: Build
        working-directory: web
        env:
          VITE_BASE_URL: /World-Cup-2026---Cooper/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Add SPA 404 fallback
        working-directory: web
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before Pages deploy retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Retry GitHub Pages deploy
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
