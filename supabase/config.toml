# https://supabase.com/docs/guides/local-development/cli/config
project_id = "world-cup-2026-cooper"

[api]
enabled = true

[db]
major_version = 15

[auth]
enabled = true
minimum_password_length = 6
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "https://nfernie.github.io/World-Cup-2026---Cooper/**",
  "https://nfernie.github.io/World-Cup-2026---Cooper/auth/callback",
]

# Username/password auth must not send mail on sign-up (built-in SMTP ~3/hour cap).
[auth.rate_limit]
sign_in_sign_ups = 60
token_verifications = 30
token_refresh = 150

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = false
secure_password_change = false
max_frequency = "1s"

# Cron invokes these without a JWT (see migration 20260607000007).
[functions.sync-fixtures]
verify_jwt = false

[functions.sync-match-results]
verify_jwt = false

[functions.sync-match-odds]
verify_jwt = false

[functions.sync-tournament-awards]
verify_jwt = false

[functions.sync-squads]
verify_jwt = false
